<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ShipControl Favicon</title>
  <desc id="desc">A dark rounded ShipControl tile with a cyan route line and SC monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="64" x2="440" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071827"/>
      <stop offset=".56" stop-color="#0b2742"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="route" x1="118" y1="348" x2="394" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
