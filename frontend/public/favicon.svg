    </linearGradient>
  </defs>
  <rect x="48" y="48" width="416" height="416" rx="120" fill="url(#bg)"/>
  <rect x="70" y="70" width="372" height="372" rx="98" fill="none" stroke="#67e8f9" stroke-opacity=".28" stroke-width="8"/>
  <path d="M126 344 C182 258 242 274 288 202 C315 160 350 142 392 138" fill="none" stroke="url(#route)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="126" cy="344" r="24" fill="#22d3ee"/>
  <circle cx="288" cy="202" r="18" fill="#99f6e4"/>
  <circle cx="392" cy="138" r="24" fill="#14b8a6"/>
  <text x="256" y="328" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="142" font-weight="900" letter-spacing="-14" text-anchor="middle">SC</text>
</svg>
